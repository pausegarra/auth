name: Deploy Application 🐋

on:
  push:
    tags:
      - "*.*.*"

jobs:
  docker:
    name: 🐋 Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: 🔽 Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Build Docker Image
        run: |
          docker build -t ghcr.io/pausegarra/auth:${{ github.ref_name }} .

      - name: 🛠️ Push Docker Image to Docker Hub
        run: |
          docker push ghcr.io/pausegarra/auth:${{ github.ref_name }}

  deploy:
    name: 🚀 Deploy Application
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read

    steps:
      - name: 🔽 Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        id: prep
        run: echo "image=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Check out Helm charts repository
        uses: actions/checkout@v4
        with:
          repository: pausegarra/helm-charts
          path: helm-charts

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Create/Update app secret in cluster
        env:
          HELM_NAMESPACE: ${{ vars.HELM_NAMESPACE }}
          APP_SECRET_NAME: ${{ vars.APP_SECRET_NAME }}
          KC_DB_USERNAME: ${{ secrets.KC_DB_USERNAME }}
          KC_DB_PASSWORD: ${{ secrets.KC_DB_PASSWORD }}
        run: |
          namespace="${HELM_NAMESPACE:-main}"
          secret_name="${APP_SECRET_NAME:-auth-secret}"

          kubectl create namespace "$namespace" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic "$secret_name" \
            --namespace "$namespace" \
            --from-literal=KC_DB_USERNAME="$KC_DB_USERNAME" \
            --from-literal=KC_DB_PASSWORD="$KC_DB_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm upgrade
        env:
          HELM_RELEASE: ${{ vars.HELM_RELEASE }}
          HELM_NAMESPACE: ${{ vars.HELM_NAMESPACE }}
          HELM_CHART_PATH: ${{ vars.HELM_CHART_PATH }}
          HELM_VALUES_FILE: ${{ vars.HELM_VALUES_FILE }}
          IMAGE_REPO: ${{ steps.prep.outputs.image }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          release="${HELM_RELEASE:-auth}"
          namespace="${HELM_NAMESPACE:-main}"
          chart_path="${HELM_CHART_PATH:-helm-charts/charts/workload}"
          values_file="${HELM_VALUES_FILE:-k3s/values.yaml}"

          echo "Deploying image tag ${IMAGE_TAG} for ghcr.io/${IMAGE_REPO}"

          if [ ! -d "$chart_path" ]; then
            echo "Chart path does not exist: $chart_path"
            exit 1
          fi

          if [ ! -f "$values_file" ]; then
            echo "Values file does not exist: $values_file"
            exit 1
          fi

          helm upgrade --install "$release" "$chart_path" \
            --namespace "$namespace" \
            --create-namespace \
            --values "$values_file" \
            --set image.tag="${IMAGE_TAG}"